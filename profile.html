<!DOCTYPE html>
<html>
    <head>
        <title>Profile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark custom-nav">
    <div class="container">

        <img src="assets/Hcl Guvi.png"
             height="45"
             alt="Logo">

        <span class="navbar-brand ms-3">
            GUVI Full Stack Project
        </span>

    </div>
</nav>

<div class="page-wrapper">

    <div class="main-card profile-card">

        <div class="profile-header">
            <h1 id="userName" class="page-title"></h1>
            <p id="userEmail" class="profile-email"></p>
        </div>

        <input
            type="number"
            id="age"
            class="form-control mb-3"
            placeholder="Enter Age">

        <input
            type="date"
            id="dob"
            class="form-control mb-3">

        <input
            type="text"
            id="contact"
            class="form-control mb-3"
            placeholder="Enter Contact">

        <textarea
            id="bio"
            class="form-control mb-3"
            placeholder="Enter Bio"></textarea>

        <button
            id="saveProfileBtn"
            class="btn btn-save w-100">
            Save Profile
        </button>

        <div id="profileMessage" class="mt-3"></div>

        <button
            id="logoutBtn"
            class="btn btn-danger btn-logout w-100 mt-3">
            Logout
        </button>

    </div>

</div>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
