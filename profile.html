<!DOCTYPE html>
<html>
    <head>
        <title>Profile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div class="container vh-100 d-flex justify-content-center align-items-center">
                    <div class="card main-card" style="max-width:700px;width:100%;">
                    <h2 class="page-title text-center mb-4">
                        User Profile
                    </h2>
                    <div class="user-box">
                        Logged in as:
                    <strong id="userEmail"></strong>
                    </div> 
                    <input
    type="number"
    id="age"
    class="form-control mb-3"
    placeholder="Enter Age"
>
<input
    type="text"
    id="contact"
    class="form-control mb-3"
    placeholder="Enter Contact"
>

<textarea
    id="bio"
    class="form-control mb-3"
    placeholder="Enter Bio"
    rows="4"
></textarea>

<button
    id="saveProfileBtn"
    class="btn btn-save w-100">
    Save Profile
</button>

<div id="profileMessage" class="mt-3"></div>
                    <button
                        id="logoutBtn"
                        class="btn btn-danger btn-logout w-100 mt-3">
                    Logout 
                </button> 
                </div>
            </div>
        </div>
    </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/profile.js"></script>
    </body>
</html>
